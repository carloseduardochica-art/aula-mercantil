<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 2773" width="600" height="2773" role="img" aria-label="Cadena de decisión de la Clase 1: del hecho a la fuente de la obligación"><rect width="600" height="2773" fill="#ffffff"/><rect x="0" y="0" width="600" height="118" fill="#0a5757"/><text x="26" y="40" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11" fill="#cfe3e2" font-weight="700" text-anchor="start" style=""><tspan x="26" dy="0">UNIVERSIDAD CATÓLICA DE CUENCA · DERECHO MERCANTIL Y SOCIETARIO</tspan></text><text x="26" y="72" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="30" fill="#ffffff" font-weight="700" text-anchor="start" style=""><tspan x="26" dy="0">La cadena del caso</tspan></text><text x="26" y="98" font-family="Charter,Georgia,'Times New Roman',serif" font-size="16" fill="#dceceb" font-weight="400" text-anchor="start" style=""><tspan x="26" dy="0">Un hecho, seis artículos, una sola decisión</tspan></text><rect x="26" y="146" width="548" height="157" rx="5" fill="#f6f6f4" stroke="#d0d0cd" stroke-width="1.2"/><rect x="26" y="146" width="5" height="157" rx="2.5" fill="#17181a"/><text x="50" y="173" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11" fill="#474745" font-weight="700" text-anchor="start" style=""><tspan x="50" dy="0">EL HECHO</tspan></text><text x="50" y="199" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#17181a" font-weight="600" text-anchor="start" style=""><tspan x="50" dy="0">Dos compras idénticas</tspan></text><text x="50" y="231" font-family="Charter,Georgia,'Times New Roman',serif" font-size="18" fill="#17181a" font-weight="400" text-anchor="start" style=""><tspan x="50" dy="0">Frutos del Austro Cía. Ltda. vende una</tspan><tspan x="50" dy="25">deshidratadora por su tienda web. USD 380.</tspan><tspan x="50" dy="25">El mismo día, el mismo modelo, dos compradores.</tspan></text><line x1="300" y1="303" x2="300" y2="324" stroke="#14807f" stroke-width="3"/><polygon points="293,323 307,323 300,333" fill="#14807f"/><rect x="26" y="341" width="548" height="218" rx="5" fill="#ffffff" stroke="#d0d0cd" stroke-width="1.2"/><rect x="26" y="341" width="5" height="218" rx="2.5" fill="#0a5757"/><text x="50" y="368" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11" fill="#474745" font-weight="700" text-anchor="start" style=""><tspan x="50" dy="0">PRIMERA PREGUNTA</tspan></text><text x="50" y="394" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#0a5757" font-weight="600" text-anchor="start" style=""><tspan x="50" dy="0">¿Es acto de comercio?</tspan></text><text x="50" y="426" font-family="Charter,Georgia,'Times New Roman',serif" font-size="18" fill="#17181a" font-weight="400" text-anchor="start" style=""><tspan x="50" dy="0">Sí. Una tienda web es un sitio virtual, y el</tspan><tspan x="50" dy="25">texto lo resuelve sin necesidad de interpretar.</tspan></text><text x="50" y="485" font-family="Charter,Georgia,'Times New Roman',serif" font-size="17" fill="#474745" font-weight="400" text-anchor="start" style="font-style:italic;"><tspan x="50" dy="0">Art. 8, lit. j) · «actividades mercantiles realizadas</tspan><tspan x="50" dy="24">por establecimientos físicos o sitios virtuales»</tspan><tspan x="50" dy="24">Y el párrafo final: la lista NO es cerrada.</tspan></text><line x1="300" y1="559" x2="300" y2="580" stroke="#14807f" stroke-width="3"/><polygon points="293,579 307,579 300,589" fill="#14807f"/><rect x="26" y="597" width="548" height="242" rx="5" fill="#ffffff" stroke="#d0d0cd" stroke-width="1.2"/><rect x="26" y="597" width="5" height="242" rx="2.5" fill="#0a5757"/><text x="50" y="624" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11" fill="#474745" font-weight="700" text-anchor="start" style=""><tspan x="50" dy="0">SEGUNDA PREGUNTA</tspan></text><text x="50" y="650" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#0a5757" font-weight="600" text-anchor="start" style=""><tspan x="50" dy="0">¿Con qué criterio se decide?</tspan></text><text x="50" y="682" font-family="Charter,Georgia,'Times New Roman',serif" font-size="18" fill="#17181a" font-weight="400" text-anchor="start" style=""><tspan x="50" dy="0">No hace falta que las dos partes busquen lucro.</tspan><tspan x="50" dy="25">Basta con que lo busque una.</tspan></text><text x="50" y="741" font-family="Charter,Georgia,'Times New Roman',serif" font-size="17" fill="#474745" font-weight="400" text-anchor="start" style="font-style:italic;"><tspan x="50" dy="0">Art. 7 · son mercantiles los actos en que interviene</tspan><tspan x="50" dy="24">un comerciante «cuando el propósito con el que</tspan><tspan x="50" dy="24">intervenga por lo menos uno de los sujetos sea el</tspan><tspan x="50" dy="24">de generar un beneficio económico».</tspan></text><line x1="300" y1="839" x2="300" y2="866" stroke="#14807f" stroke-width="3"/><polygon points="293,865 307,865 300,875" fill="#14807f"/><text x="300" y="887" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="12" fill="#474745" font-weight="700" text-anchor="middle" style=""><tspan x="300" dy="0">AQUÍ SE SEPARAN LOS CAMINOS</tspan></text><path d="M 300 909 V 931 H 159 V 949" fill="none" stroke="#7a5200" stroke-width="3"/><path d="M 300 909 V 931 H 441 V 949" fill="none" stroke="#14603a" stroke-width="3"/><polygon points="152,949 166,949 159,959" fill="#7a5200"/><polygon points="434,949 448,949 441,959" fill="#14603a"/><rect x="26" y="969" width="265" height="437" rx="5" fill="#fdf6e3" stroke="#e0cd93" stroke-width="1.2"/><rect x="26" y="969" width="5" height="437" rx="2.5" fill="#7a5200"/><text x="50" y="996" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11" fill="#474745" font-weight="700" text-anchor="start" style=""><tspan x="50" dy="0">RAMA A</tspan></text><text x="50" y="1022" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#7a5200" font-weight="600" text-anchor="start" style=""><tspan x="50" dy="0">Rosa</tspan></text><text x="50" y="1054" font-family="Charter,Georgia,'Times New Roman',serif" font-size="18" fill="#17181a" font-weight="400" text-anchor="start" style=""><tspan x="50" dy="0">Jubilada. Compra la</tspan><tspan x="50" dy="25">deshidratadora para</tspan><tspan x="50" dy="25">su casa. No es</tspan><tspan x="50" dy="25">comerciante y no</tspan><tspan x="50" dy="25">busca lucro.</tspan></text><text x="50" y="1188" font-family="Charter,Georgia,'Times New Roman',serif" font-size="17" fill="#474745" font-weight="400" text-anchor="start" style="font-style:italic;"><tspan x="50" dy="0">Arts. 1 y 4 · el Código</tspan><tspan x="50" dy="24">rige los actos de</tspan><tspan x="50" dy="24">comercio «aunque sean</tspan><tspan x="50" dy="24">ejecutados por no</tspan><tspan x="50" dy="24">comerciantes», y el</tspan><tspan x="50" dy="24">ocasional «queda</tspan><tspan x="50" dy="24">sujeto a este Código</tspan><tspan x="50" dy="24">en cuanto a dichas</tspan><tspan x="50" dy="24">operaciones».</tspan></text><rect x="309" y="969" width="265" height="437" rx="5" fill="#e6f0ea" stroke="#8bbfa3" stroke-width="1.2"/><rect x="309" y="969" width="5" height="437" rx="2.5" fill="#14603a"/><text x="333" y="996" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11" fill="#474745" font-weight="700" text-anchor="start" style=""><tspan x="333" dy="0">RAMA B</tspan></text><text x="333" y="1022" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#14603a" font-weight="600" text-anchor="start" style=""><tspan x="333" dy="0">Julio</tspan></text><text x="333" y="1054" font-family="Charter,Georgia,'Times New Roman',serif" font-size="18" fill="#17181a" font-weight="400" text-anchor="start" style=""><tspan x="333" dy="0">Tiene puesto en el</tspan><tspan x="333" dy="25">mercado. Compra la</tspan><tspan x="333" dy="25">deshidratadora para</tspan><tspan x="333" dy="25">secar la fruta que</tspan><tspan x="333" dy="25">revende.</tspan></text><text x="333" y="1188" font-family="Charter,Georgia,'Times New Roman',serif" font-size="17" fill="#474745" font-weight="400" text-anchor="start" style="font-style:italic;"><tspan x="333" dy="0">Art. 2, lit. a) · es</tspan><tspan x="333" dy="24">comerciante, hace del</tspan><tspan x="333" dy="24">comercio su ocupación</tspan><tspan x="333" dy="24">habitual.</tspan><tspan x="333" dy="24">Art. 8, párrafo final ·</tspan><tspan x="333" dy="24">son actos de comercio</tspan><tspan x="333" dy="24">«todos los relacionados</tspan><tspan x="333" dy="24">con actividades o</tspan><tspan x="333" dy="24">empresas de comercio».</tspan></text><rect x="26" y="1420" width="265" height="58" rx="5" fill="#7a5200"/><text x="158" y="1444" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" style=""><tspan x="158" dy="0">MERCANTIL SOLO</tspan></text><text x="158" y="1463" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" style=""><tspan x="158" dy="0">PARA UNA PARTE</tspan></text><rect x="309" y="1420" width="265" height="58" rx="5" fill="#14603a"/><text x="441" y="1444" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" style=""><tspan x="441" dy="0">MERCANTIL PARA</tspan></text><text x="441" y="1463" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" style=""><tspan x="441" dy="0">LAS DOS PARTES</tspan></text><path d="M 159 1478 V 1498 H 300 V 1516" fill="none" stroke="#14807f" stroke-width="3"/><path d="M 441 1478 V 1498 H 300 V 1516" fill="none" stroke="#14807f" stroke-width="3"/><polygon points="293,1516 307,1516 300,1526" fill="#14807f"/><text x="300" y="1540" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="12" fill="#474745" font-weight="700" text-anchor="middle" style=""><tspan x="300" dy="0">LOS DOS CAMINOS VUELVEN AL MISMO SITIO</tspan></text><rect x="26" y="1562" width="548" height="132" rx="5" fill="#f6f6f4" stroke="#d0d0cd" stroke-width="1.2"/><rect x="26" y="1562" width="5" height="132" rx="2.5" fill="#17181a"/><text x="50" y="1589" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11" fill="#474745" font-weight="700" text-anchor="start" style=""><tspan x="50" dy="0">HECHO NUEVO</tspan></text><text x="50" y="1615" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#17181a" font-weight="600" text-anchor="start" style=""><tspan x="50" dy="0">La deshidratadora llega dañada</tspan></text><text x="50" y="1647" font-family="Charter,Georgia,'Times New Roman',serif" font-size="18" fill="#17181a" font-weight="400" text-anchor="start" style=""><tspan x="50" dy="0">La empresa tiene que responder.</tspan><tspan x="50" dy="25">¿De dónde nace esa obligación?</tspan></text><line x1="300" y1="1694" x2="300" y2="1715" stroke="#14807f" stroke-width="3"/><polygon points="293,1714 307,1714 300,1724" fill="#14807f"/><rect x="26" y="1732" width="548" height="247" rx="5" fill="#ffffff" stroke="#d0d0cd" stroke-width="1.2"/><rect x="26" y="1732" width="5" height="247" rx="2.5" fill="#0a5757"/><text x="50" y="1759" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11" fill="#474745" font-weight="700" text-anchor="start" style=""><tspan x="50" dy="0">DONDE NO HAY QUE BUSCAR</tspan></text><text x="50" y="1785" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#0a5757" font-weight="600" text-anchor="start" style=""><tspan x="50" dy="0">El Código de Comercio no</tspan><tspan x="50" dy="29">regula las fuentes</tspan></text><text x="50" y="1846" font-family="Charter,Georgia,'Times New Roman',serif" font-size="18" fill="#17181a" font-weight="400" text-anchor="start" style=""><tspan x="50" dy="0">No es que busque mal: no está. El Código no</tspan><tspan x="50" dy="25">construye una teoría de las fuentes. Remite.</tspan></text><text x="50" y="1905" font-family="Charter,Georgia,'Times New Roman',serif" font-size="17" fill="#474745" font-weight="400" text-anchor="start" style="font-style:italic;"><tspan x="50" dy="0">Art. 5 · «En los casos no regulados expresamente,</tspan><tspan x="50" dy="24">se aplicarán por analogía las normas de este Código</tspan><tspan x="50" dy="24">y, en su defecto, las del Código Civil».</tspan></text><line x1="300" y1="1979" x2="300" y2="2000" stroke="#14807f" stroke-width="3"/><polygon points="293,1999 307,1999 300,2009" fill="#14807f"/><rect x="26" y="2017" width="548" height="207" rx="5" fill="#e2eeed" stroke="#14807f" stroke-width="1.2"/><rect x="26" y="2017" width="5" height="207" rx="2.5" fill="#14807f"/><text x="50" y="2044" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11" fill="#474745" font-weight="700" text-anchor="start" style=""><tspan x="50" dy="0">LA RESPUESTA</tspan></text><text x="50" y="2070" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#14807f" font-weight="600" text-anchor="start" style=""><tspan x="50" dy="0">Código Civil, Art. 1453</tspan></text><text x="50" y="2102" font-family="Charter,Georgia,'Times New Roman',serif" font-size="18" fill="#17181a" font-weight="400" text-anchor="start" style=""><tspan x="50" dy="0">Las obligaciones nacen del contrato · de un hecho</tspan><tspan x="50" dy="25">voluntario, los cuasicontratos · de un hecho dañoso,</tspan><tspan x="50" dy="25">delitos y cuasidelitos · o por disposición de la ley.</tspan><tspan x="50" dy="25"></tspan><tspan x="50" dy="25">La de Frutos del Austro nace del CONTRATO.</tspan></text><line x1="300" y1="2224" x2="300" y2="2245" stroke="#14807f" stroke-width="3"/><polygon points="293,2244 307,2244 300,2254" fill="#14807f"/><rect x="26" y="2262" width="548" height="243" rx="5" fill="#ffffff" stroke="#d0d0cd" stroke-width="1.2"/><rect x="26" y="2262" width="5" height="243" rx="2.5" fill="#0a5757"/><text x="50" y="2289" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11" fill="#474745" font-weight="700" text-anchor="start" style=""><tspan x="50" dy="0">¿Y SI LA LEY CALLA?</tspan></text><text x="50" y="2315" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#0a5757" font-weight="600" text-anchor="start" style=""><tspan x="50" dy="0">La costumbre mercantil</tspan></text><text x="50" y="2347" font-family="Charter,Georgia,'Times New Roman',serif" font-size="18" fill="#17181a" font-weight="400" text-anchor="start" style=""><tspan x="50" dy="0">Una fuente que en derecho civil no opera igual.</tspan><tspan x="50" dy="25">Es una de las características del derecho mercantil,</tspan><tspan x="50" dy="25">y aquí se la ve funcionando.</tspan></text><text x="50" y="2431" font-family="Charter,Georgia,'Times New Roman',serif" font-size="17" fill="#474745" font-weight="400" text-anchor="start" style="font-style:italic;"><tspan x="50" dy="0">Art. 6 · «La costumbre mercantil suple el silencio de</tspan><tspan x="50" dy="24">la ley», si los hechos son uniformes, públicos y</tspan><tspan x="50" dy="24">generalmente ejecutados.</tspan></text><rect x="26" y="2535" width="548" height="172" rx="5" fill="#0a5757"/><text x="48" y="2569" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="12" fill="#cfe3e2" font-weight="700" text-anchor="start" style=""><tspan x="48" dy="0">LO QUE HAY QUE LLEVARSE</tspan></text><text x="48" y="2601" font-family="Charter,Georgia,'Times New Roman',serif" font-size="18" fill="#ffffff" font-weight="400" text-anchor="start" style=""><tspan x="48" dy="0">La calificación del acto la dio el Código de</tspan><tspan x="48" dy="25">Comercio. La fuente de la obligación la dio el</tspan><tspan x="48" dy="25">Código Civil. Un solo caso, dos cuerpos legales,</tspan><tspan x="48" dy="25">y un artículo —el 5— que los une.</tspan></text><text x="26" y="2733" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#474745" font-weight="400" text-anchor="start" style=""><tspan x="26" dy="0">Clase 1 · Bloque 1 · Derecho Mercantil y Societario · DER-03-4</tspan><tspan x="26" dy="18">Articulado cotejado contra el Código de Comercio de 2019.</tspan></text></svg>